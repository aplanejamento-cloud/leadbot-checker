        utm_content: utmLp.utm_content || '',
        non_interaction: true
      });
    }
    document.querySelectorAll('a[href*="planificador7.gumroad.com"]').forEach(function(el){
      el.addEventListener('click', function(){
        if (!window.gtag) return;
        var qi = el.href.indexOf('?');
        var qp = qi > 0 ? new URLSearchParams(el.href.substring(qi)) : new URLSearchParams();
        var utmEv = {};
        ['utm_source','utm_medium','utm_campaign','utm_content','utm_term'].forEach(function(k){
          var v = qp.get(k); if (v) utmEv[k] = v;
        });
        gtag('event', 'cta_click', {
          event_category: 'funnel',
          destination: 'gumroad_checkout',
          utm_source: utmEv.utm_source || '',

          utm_campaign: utmEv.utm_campaign || '',
          utm_content: utmEv.utm_content || '',
          utm_term: utmEv.utm_term || '',
          link_url: el.href
        });
        gtag('event', 'checkout_start', {
          event_category: 'funnel',
          destination: 'gumroad_checkout',
          utm_source: utmEv.utm_source || '',
          utm_medium: utmEv.utm_medium || '',
          utm_campaign: utmEv.utm_campaign || '',
          utm_content: utmEv.utm_content || '',
          utm_term: utmEv.utm_term || '',
          link_url: el.href
        });
      });
    });
  });

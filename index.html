<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Perda de Leads no WhatsApp</title>
    <meta name="description" content="Calcule quanto seu negócio está perdendo por não responder leads no WhatsApp a tempo. Descubra como o LeadBot 24h pode ajudar.">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [{
        "@type": "Question",
        "name": "O que é a Calculadora de Perda de Leads no WhatsApp?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "É uma ferramenta que ajuda pequenos negócios a estimarem quanto estão perdendo por não responderem leads no WhatsApp a tempo."
        }
      }, {
        "@type": "Question",
        "name": "Como o LeadBot 24h pode ajudar?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "O LeadBot 24h é uma solução automatizada que responde leads no WhatsApp em até 1 minuto, aumentando suas chances de conversão."
        }
      }]
    }
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            color: #333;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #047857;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        select, input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #059669;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        button:hover {
            background-color: #047857;
        }
        #results {
            margin-top: 20px;
            padding: 15px;
            background-color: #f0f0f0;
            border-radius: 4px;
            display: none;
        }
        .cta-button {
            background-color: #047857;
            margin-top: 20px;
        }
        .cta-button:hover {
            background-color: #059669;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Calculadora de Perda de Leads no WhatsApp</h1>
        <p>Descubra quanto seu negócio está perdendo por não responder leads no WhatsApp a tempo.</p>

        <div class="form-group">
            <label for="tipo_negocio">Tipo de Negócio:</label>
            <select id="tipo_negocio">
                <option value="oficina">Oficina</option>
                <option value="clínica">Clínica</option>
                <option value="salão">Salão</option>
                <option value="e-commerce">E-commerce</option>
                <option value="autônomo">Autônomo</option>
                <option value="outro">Outro</option>
            </select>
        </div>

        <div class="form-group">
            <label for="leads_mes">Leads por mês:</label>
            <input type="number" id="leads_mes" placeholder="Ex: 100">
        </div>

        <div class="form-group">
            <label for="tempo_resposta_horas">Tempo médio de resposta (horas):</label>
            <input type="number" id="tempo_resposta_horas" placeholder="Ex: 2">
        </div>

        <div class="form-group">
            <label for="ticket_medio">Ticket médio (R$):</label>
            <input type="number" id="ticket_medio" placeholder="Ex: 150">
        </div>

        <div class="form-group">
            <label for="taxa_conversao_pct">Taxa de conversão (%):</label>
            <input type="number" id="taxa_conversao_pct" placeholder="Ex: 20">
        </div>

        <button onclick="calcularPrejuizo()">Calcular prejuízo</button>

        <div id="results">
            <h2>Resultado:</h2>
            <p><strong>Leads perdidos por mês:</strong> <span id="leads_perdidos_mes">0</span></p>
            <p><strong>Receita perdida por mês:</strong> R$ <span id="receita_perdida_mes">0</span></p>
            <p><strong>Receita perdida por ano:</strong> R$ <span id="receita_perdida_ano">0</span></p>
        </div>

        <a href="https://planificador7.gumroad.com/l/leadbot-24h" class="cta-button">Resolver com LeadBot 24h — R$ 197</a>
    </div>

    <script>
        function calcularPrejuizo() {
            // Obter valores do formulário
            const leadsMes = parseFloat(document.getElementById('leads_mes').value) || 0;
            const tempoResposta = parseFloat(document.getElementById('tempo_resposta_horas').value) || 0;
            const ticketMedio = parseFloat(document.getElementById('ticket_medio').value) || 0;
            const taxaConversao = parseFloat(document.getElementById('taxa_conversao_pct').value) || 0;

            // Calcular leads perdidos (estimativa baseada no tempo de resposta)
            // Assumindo que a cada hora de atraso, perde-se 10% dos leads
            const leadsPerdidosMes = Math.round(leadsMes * (Math.min(tempoResposta * 0.1, 0.9)));

            // Calcular receita perdida
            const receitaPerdidaMes = Math.round(leadsPerdidosMes * (ticketMedio * (taxaConversao / 100)));
            const receitaPerdidaAno = receitaPerdidaMes * 12;

            // Exibir resultados
            document.getElementById('leads_perdidos_mes').textContent = leadsPerdidosMes;
            document.getElementById('receita_perdida_mes').textContent = receitaPerdidaMes.toLocaleString('pt-BR');
            document.getElementById('receita_perdida_ano').textContent = receitaPerdidaAno.toLocaleString('pt-BR');

            // Mostrar seção de resultados
            document.getElementById('results').style.display = 'block';
        }
    </script>
</body>
</html>

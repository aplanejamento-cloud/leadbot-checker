<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Prejuízo por Leads Perdidos no WhatsApp</title>
    <meta name="description" content="Calcule quanto seu negócio está perdendo por não responder leads no WhatsApp a tempo. Descubra como o LeadBot 24h pode ajudar.">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [{
        "@type": "Question",
        "name": "O que é a Calculadora de Prejuízo por Leads Perdidos no WhatsApp?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "É uma ferramenta que ajuda pequenos negócios a calcular quanto estão perdendo por não responder leads no WhatsApp a tempo."
        }
      }, {
        "@type": "Question",
        "name": "Como a calculadora funciona?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Você insere informações sobre seu negócio, como número de leads por mês, tempo de resposta, ticket médio e taxa de conversão. A calculadora então estima seus leads perdidos e receita perdida."
        }
      }, {
        "@type": "Question",
        "name": "O que é o LeadBot 24h?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "LeadBot 24h é uma solução que ajuda pequenos negócios a responder leads no WhatsApp automaticamente, 24 horas por dia, para evitar perder vendas."
        }
      }]
    }
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            color: #333;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #047857;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        select, input[type="number"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #059669;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        button:hover {
            background-color: #047857;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #e8f5e9;
            border-radius: 4px;
            display: none;
        }
        .cta-button {
            background-color: #047857;
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: white;
            padding: 10px;
            border-radius: 4px;
        }
        .cta-button:hover {
            background-color: #059669;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Calculadora de Prejuízo por Leads Perdidos no WhatsApp</h1>
        <form id="leadForm">
            <div class="form-group">
                <label for="tipo_negocio">Tipo de Negócio:</label>
                <select id="tipo_negocio" required>
                    <option value="">Selecione</option>
                    <option value="oficina">Oficina</option>
                    <option value="clínica">Clínica</option>
                    <option value="salão">Salão</option>
                    <option value="e-commerce">E-commerce</option>
                    <option value="autônomo">Autônomo</option>
                    <option value="outro">Outro</option>
                </select>
            </div>
            <div class="form-group">
                <label for="leads_mes">Leads por Mês:</label>
                <input type="number" id="leads_mes" required>
            </div>
            <div class="form-group">
                <label for="tempo_resposta_horas">Tempo de Resposta (horas):</label>
                <input type="number" id="tempo_resposta_horas" required>
            </div>
            <div class="form-group">
                <label for="ticket_medio">Ticket Médio (R$):</label>
                <input type="number" id="ticket_medio" required>
            </div>
            <div class="form-group">
                <label for="taxa_conversao_pct">Taxa de Conversão (%):</label>
                <input type="number" id="taxa_conversao_pct" required>
            </div>
            <button type="button" onclick="calcularPrejuizo()">Calcular Prejuízo</button>
        </form>
        <div class="result" id="result">
            <h2>Resultado:</h2>
            <p><strong>Leads perdidos por mês:</strong> <span id="leads_perdidos_mes"></span></p>
            <p><strong>Receita perdida por mês:</strong> R$ <span id="receita_perdida_mes"></span></p>
            <p><strong>Receita perdida por ano:</strong> R$ <span id="receita_perdida_ano"></span></p>
        </div>
        <a href="https://planificador7.gumroad.com/l/leadbot-24h" class="cta-button">Resolver com LeadBot 24h — R$ 197</a>
    </div>
    <script>
        function calcularPrejuizo() {
            // Obter valores do formulário
            const leadsMes = parseFloat(document.getElementById('leads_mes').value);
            const tempoResposta = parseFloat(document.getElementById('tempo_resposta_horas').value);
            const ticketMedio = parseFloat(document.getElementById('ticket_medio').value);
            const taxaConversao = parseFloat(document.getElementById('taxa_conversao_pct').value);

            // Calcular leads perdidos (simplificado: assume que leads não respondidos em até 1h são perdidos)
            const leadsPerdidosMes = tempoResposta > 1 ? leadsMes * 0.5 : leadsMes * 0.1;

            // Calcular receita perdida
            const receitaPerdidaMes = leadsPerdidosMes * (taxaConversao / 100) * ticketMedio;
            const receitaPerdidaAno = receitaPerdidaMes * 12;

            // Exibir resultados
            document.getElementById('leads_perdidos_mes').textContent = Math.round(leadsPerdidosMes);
            document.getElementById('receita_perdida_mes').textContent = Math.round(receitaPerdidaMes).toLocaleString('pt-BR');
            document.getElementById('receita_perdida_ano').textContent = Math.round(receitaPerdidaAno).toLocaleString('pt-BR');

            // Mostrar resultado
            document.getElementById('result').style.display = 'block';
        }
    </script>
</body>
</html>

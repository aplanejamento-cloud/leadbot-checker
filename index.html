<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calcule quanto seu negócio está perdendo por não responder leads no WhatsApp a tempo. Descubra como o LeadBot 24h pode ajudar.">
    <title>WhatsApp Lead Loss Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            color: #333;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #047857;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        select, input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #059669;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        button:hover {
            background-color: #047857;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #f0f0f0;
            border-radius: 4px;
            display: none;
        }
        .cta-button {
            background-color: #047857;
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: white;
            padding: 10px;
            border-radius: 4px;
        }
        .cta-button:hover {
            background-color: #059669;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>WhatsApp Lead Loss Calculator</h1>
        <p>Descubra quanto seu negócio está perdendo por não responder leads no WhatsApp a tempo.</p>

        <div class="form-group">
            <label for="tipo_negocio">Tipo de Negócio:</label>
            <select id="tipo_negocio">
                <option value="oficina">Oficina</option>
                <option value="clinica">Clínica</option>
                <option value="salao">Salão</option>
                <option value="ecommerce">E-commerce</option>
                <option value="autonomo">Autônomo</option>
                <option value="outro">Outro</option>
            </select>
        </div>

        <div class="form-group">
            <label for="leads_mes">Leads por Mês:</label>
            <input type="number" id="leads_mes" placeholder="Ex: 100">
        </div>

        <div class="form-group">
            <label for="tempo_resposta_horas">Tempo de Resposta (horas):</label>
            <input type="number" id="tempo_resposta_horas" placeholder="Ex: 2">
        </div>

        <div class="form-group">
            <label for="ticket_medio">Ticket Médio (R$):</label>
            <input type="number" id="ticket_medio" placeholder="Ex: 150">
        </div>

        <div class="form-group">
            <label for="taxa_conversao_pct">Taxa de Conversão (%):</label>
            <input type="number" id="taxa_conversao_pct" placeholder="Ex: 30">
        </div>

        <button onclick="calcularPrejuizo()">Calcular Prejuízo</button>

        <div class="result" id="result">
            <h2>Resultado:</h2>
            <p><strong>Leads perdidos por mês:</strong> <span id="leads_perdidos_mes"></span></p>
            <p><strong>Receita perdida por mês:</strong> R$ <span id="receita_perdida_mes"></span></p>
            <p><strong>Receita perdida por ano:</strong> R$ <span id="receita_perdida_ano"></span></p>
        </div>

        <a href="https://planificador7.gumroad.com/l/leadbot-24h" class="cta-button">Resolver com LeadBot 24h — R$ 197</a>
    </div>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "O que é o WhatsApp Lead Loss Calculator?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O WhatsApp Lead Loss Calculator é uma ferramenta que ajuda a calcular quanto seu negócio está perdendo por não responder leads no WhatsApp a tempo."
          }
        },
        {
          "@type": "Question",
          "name": "Como o LeadBot 24h pode ajudar?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O LeadBot 24h é uma solução que responde automaticamente aos leads no WhatsApp, garantindo que nenhum lead seja perdido e aumentando suas vendas."
          }
        }
      ]
    }
    </script>

    <script>
        function calcularPrejuizo() {
            const tipoNegocio = document.getElementById('tipo_negocio').value;
            const leadsMes = parseFloat(document.getElementById('leads_mes').value);
            const tempoResposta = parseFloat(document.getElementById('tempo_resposta_horas').value);
            const ticketMedio = parseFloat(document.getElementById('ticket_medio').value);
            const taxaConversao = parseFloat(document.getElementById('taxa_conversao_pct').value);

            // Fórmula simplificada para cálculo de leads perdidos
            const leadsPerdidosMes = Math.round(leadsMes * (tempoResposta / 24) * 0.7);
            const receitaPerdidaMes = Math.round(leadsPerdidosMes * (taxaConversao / 100) * ticketMedio);
            const receitaPerdidaAno = receitaPerdidaMes * 12;

            document.getElementById('leads_perdidos_mes').textContent = leadsPerdidosMes;
            document.getElementById('receita_perdida_mes').textContent = receitaPerdidaMes.toLocaleString();
            document.getElementById('receita_perdida_ano').textContent = receitaPerdidaAno.toLocaleString();

            document.getElementById('result').style.display = 'block';
        }
    </script>
</body>
</html>

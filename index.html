<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Prejuízo por Leads Perdidos no WhatsApp</title>
    <meta name="description" content="Calcule quanto seu negócio está perdendo por não responder leads no WhatsApp a tempo. Descubra como o LeadBot 24h pode ajudar.">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [{
        "@type": "Question",
        "name": "O que é a Calculadora de Prejuízo por Leads Perdidos no WhatsApp?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "É uma ferramenta que ajuda pequenos negócios a estimarem quanto estão perdendo por não responderem leads no WhatsApp a tempo."
        }
      }, {
        "@type": "Question",
        "name": "Como funciona o cálculo?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "O cálculo é baseado no número de leads mensais, tempo de resposta, ticket médio e taxa de conversão do seu negócio."
        }
      }, {
        "@type": "Question",
        "name": "O que é o LeadBot 24h?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "LeadBot 24h é uma solução que ajuda pequenos negócios a responderem leads no WhatsApp automaticamente, 24 horas por dia, por apenas R$ 197."
        }
      }]
    }
    </script>
    <style>
        :root {
            --primary-color: #059669;
            --secondary-color: #047857;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            color: var(--primary-color);
            text-align: center;
            font-size: 1.8rem;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        select, input {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem;
            width: 100%;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
        }
        button:hover {
            background-color: var(--secondary-color);
        }
        #results {
            display: none;
            margin-top: 2rem;
            padding: 1rem;
            background-color: #f5f5f5;
            border-radius: 4px;
        }
        .result-item {
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }
        .cta-button {
            background-color: var(--secondary-color);
            margin-top: 1rem;
            display: block;
            text-align: center;
            text-decoration: none;
            color: white;
            padding: 0.75rem;
            border-radius: 4px;
            font-weight: bold;
        }
        .highlight {
            color: var(--primary-color);
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Calculadora de Prejuízo por Leads Perdidos no WhatsApp</h1>
    <div class="form-group">
        <label for="tipo_negocio">Tipo de Negócio:</label>
        <select id="tipo_negocio">
            <option value="oficina">Oficina</option>
            <option value="clinica">Clínica</option>
            <option value="salao">Salão</option>
            <option value="ecommerce">E-commerce</option>
            <option value="autonomo">Autônomo</option>
            <option value="outro">Outro</option>
        </select>
    </div>
    <div class="form-group">
        <label for="leads_mes">Leads por Mês:</label>
        <input type="number" id="leads_mes" placeholder="Ex: 100">
    </div>
    <div class="form-group">
        <label for="tempo_resposta_horas">Tempo de Resposta (horas):</label>
        <input type="number" id="tempo_resposta_horas" placeholder="Ex: 2">
    </div>
    <div class="form-group">
        <label for="ticket_medio">Ticket Médio (R$):</label>
        <input type="number" id="ticket_medio" placeholder="Ex: 150">
    </div>
    <div class="form-group">
        <label for="taxa_conversao_pct">Taxa de Conversão (%):</label>
        <input type="number" id="taxa_conversao_pct" placeholder="Ex: 30">
    </div>
    <button onclick="calcularPrejuizo()">Calcular Prejuízo</button>

    <div id="results">
        <h2>Resultado:</h2>
        <div class="result-item">Leads perdidos por mês: <span class="highlight" id="leads_perdidos_mes">0</span></div>
        <div class="result-item">Receita perdida por mês: R$ <span class="highlight" id="receita_perdida_mes">0</span></div>
        <div class="result-item">Receita perdida por ano: R$ <span class="highlight" id="receita_perdida_ano">0</span></div>
        <a href="https://planificador7.gumroad.com/l/leadbot-24h" class="cta-button">Resolver com LeadBot 24h — R$ 197</a>
    </div>

    <script>
        function calcularPrejuizo() {
            // Obter valores do formulário
            const leadsMes = parseFloat(document.getElementById('leads_mes').value) || 0;
            const tempoResposta = parseFloat(document.getElementById('tempo_resposta_horas').value) || 0;
            const ticketMedio = parseFloat(document.getElementById('ticket_medio').value) || 0;
            const taxaConversao = parseFloat(document.getElementById('taxa_conversao_pct').value) || 0;

            // Cálculos
            const leadsPerdidosMes = Math.round(leadsMes * (Math.min(tempoResposta, 24) / 24) * 0.7);
            const receitaPerdidaMes = Math.round(leadsPerdidosMes * (taxaConversao / 100) * ticketMedio);
            const receitaPerdidaAno = receitaPerdidaMes * 12;

            // Exibir resultados
            document.getElementById('leads_perdidos_mes').textContent = leadsPerdidosMes;
            document.getElementById('receita_perdida_mes').textContent = receitaPerdidaMes.toLocaleString('pt-BR');
            document.getElementById('receita_perdida_ano').textContent = receitaPerdidaAno.toLocaleString('pt-BR');

            // Mostrar resultados
            document.getElementById('results').style.display = 'block';
        }
    </script>
</body>
</html>
